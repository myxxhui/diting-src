version: "3.8"
services:
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: super-evo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SUPER_EVO_MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${SUPER_EVO_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - super-evo-minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: super-evo-redis
    ports:
      - "6379:6379"
    volumes:
      - super-evo-redis-data:/data
    restart: unless-stopped

volumes:
  super-evo-minio-data:
  super-evo-redis-data:

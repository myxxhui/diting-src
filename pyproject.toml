[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diting-src"
version = "0.1.0"
description = "Diting 核心包（重构版）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "aiosmtplib>=3.0",
    "pytest-asyncio>=0.24",
    "weasyprint>=62.0",
    "fakeredis>=2.23",
    "boto3>=1.34.0,<1.35.0",
    "botocore>=1.34.0,<1.35.0",
    "dvc>=3.48.0,<3.49.0",
    "dvc-s3>=3.0.0,<3.1.0",
    "pathspec>=0.11,<0.12",
    "wandb>=0.16",
    "scikit-learn>=1.4",
    "click>=8.1",
    "anthropic>=0.25",
    "jsonschema>=4.21",
    "openai>=1.30",
    "tenacity>=8.2",
    # cryo_guard（维度一 step_01）· [Ref: 03_/01_维度一/.../step_01]
    "numpy>=1.26",
    "pymilvus>=2.3.0,<2.5.0",
    "neo4j>=5.18",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "alembic>=1.13",
    # step_02 数据采集（维度一 / 维度二）
    "akshare>=1.14",
    "tqdm>=4.66",
    "pdfplumber>=0.11",
    "feedparser>=6.0",
    "jieba>=0.42",
]

[project.optional-dependencies]
# 月报 PDF 中文 glyph 单测（test_monthly_pdf_contains_chinese_glyph）；镜像构建推荐安装
pdf-verify = ["pdfminer.six>=20240706"]
# step_04 C3 LLaMA-Factory 训练流水线 · [Ref: 03_/05_维度五/.../step_04]
training = [
    "torch>=2.2",
    "transformers>=4.43",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.19",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "llamafactory>=0.8.3",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["diting*", "apps*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

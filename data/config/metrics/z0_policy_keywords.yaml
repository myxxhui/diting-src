  # ── 定制化产业链 BOM 节点（经人工筛选与深度评估，可持续更新） ──
  # 每个赛道一套固定的 20-25 个关键节点，替代 LLM 动态生成。
    curated_bom_nodes:

    # ═══ L1 基础设施层（5 个） ═══
    - node_id: data_center_construction
      name: 智算中心建设与配套
      tier: 重要
      layer: L1
    - node_id: power_system
      name: 电力保障与UPS系统
      tier: 重要
      layer: L1
    - node_id: high_speed_interconnect
      name: 高速互联与布线
      tier: 核心
      layer: L1
    - node_id: liquid_cooling
      name: 液冷散热系统
      tier: 重要
      layer: L1
    - node_id: computing_rental
      name: 算力租赁与云服务
      tier: 配套
      layer: L1

    # ═══ L2 芯片与硬件层（11 个） ═══
    - node_id: eda_tool
      name: 芯片设计EDA工具
      tier: 核心
      layer: L2
    - node_id: fab_equipment
      name: 半导体制造设备
      tier: 核心
      layer: L2
    - node_id: wafer_substrate
      name: 大硅片与衬底材料
      tier: 配套
      layer: L2
    - node_id: advanced_packaging
      name: 先进封装(CoWoS/Chiplet)
      tier: 核心
      layer: L2
    - node_id: ai_chip
      name: AI训练/推理芯片(GPU/NPU/ASIC)
      tier: 核心
      layer: L2
    - node_id: hbm_memory
      name: 高带宽存储(HBM)
      tier: 核心
      layer: L2
    - node_id: ai_server
      name: AI服务器及系统集成
      tier: 重要
      layer: L2
    - node_id: optical_module
      name: 高速光模块(800G/1.6T/CPO)
      tier: 重要
      layer: L2
    - node_id: high_speed_switch
      name: 高速网络交换机
      tier: 重要
      layer: L2
    - node_id: pcb_connector
      name: 高速PCB与铜连接器
      tier: 重要
      layer: L2
    - node_id: power_management_chip
      name: AI服务器电源管理芯片
      tier: 配套
      layer: L2

    # ═══ L3 平台软件层（3 个） ═══
    - node_id: computing_scheduling
      name: 算力调度与CUDA兼容生态
      tier: 核心
      layer: L3
    - node_id: training_platform
      name: 大模型训推平台/MLOps
      tier: 重要
      layer: L3
    - node_id: ai_framework
      name: AI开发框架与工具链
      tier: 重要
      layer: L3

    # ═══ L4 大模型层（2 个） ═══
    - node_id: foundation_model
      name: 基座大模型(文本/多模态)
      tier: 核心
      layer: L4
    - node_id: inference_optimization
      name: 推理优化与模型压缩
      tier: 重要
      layer: L4

    # ═══ L5 应用与服务层（4 个） ═══
    - node_id: ai_agent
      name: AI Agent与智能体平台
      tier: 重要
      layer: L5
    - node_id: ai_appliance
      name: AI终端端侧应用
      tier: 重要
      layer: L5
    - node_id: industry_solution
      name: 行业AI解决方案(金融/医疗等)
      tier: 配套
      layer: L5
    - node_id: ai_security
      name: AI安全与模型对齐
      tier: 配套
      layer: L5


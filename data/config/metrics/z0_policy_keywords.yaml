# Z0-M2 政策赛道关键词 · DeepSea PG doc_registry 元数据 + T1 enum 归并
# [Ref: 34_ §3.2 · 29_ §5.1 · 禁止 OpenSearch/BM25]
schema_version: "1.2"
probe_key: M.policy.sector_direction
doc_type: policy
scope_segment_a: S0
queries:
  - "人工智能 产业政策"
  - "新质生产力 规划"
  - "低空经济 试点"
  - "算力 基础设施"

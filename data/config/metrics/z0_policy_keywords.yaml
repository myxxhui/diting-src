# Z0-M2 政策赛道关键词 · v2.0 双向映射体系
# ───────────────────────────────────────────────
# 设计：政策官方术语 → canonical_sector → A股概念板块
# 每日自动同步概念列表 → 可投资边界与政策风口一致
# [Ref: 34_ §3.2 · 29_ §5.1]
schema_version: "2.0"
probe_key: M.policy.sector_direction
doc_type: policy
scope_segment_a: S0

# ═══════════════ 概念板块自动刷新 ═══════════════
concept_sync:
  enabled: true
  schedule: "daily"          # daily / weekly
  sources: ["ths"]           # 同花顺概念（唯一全量筛查源）
  cron_hint: "0 8 * * *"     # 每天早8点（建议）

# ═══════════════ 顺逆风关键词 ═══════════════
direction_rules:
  enum_values: [tailwind, headwind, neutral, mixed]
  tailwind:
    - "支持"
    - "加快"
    - "推动"
    - "鼓励"
    - "试点"
    - "规划"
    - "发展"
    - "建设"
    - "升级"
    - "扩容"
    - "培育"
    - "壮大"
    - "扶持"
    - "推进"
    - "引领"
  headwind:
    - "限制"
    - "禁止"
    - "淘汰"
    - "整顿"
    - "遏制"
    - "严控"
    - "清理"
    - "打击"
    - "取缔"


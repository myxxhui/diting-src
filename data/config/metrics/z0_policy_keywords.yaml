# Z0-M2 政策赛道关键词 · DeepSea PG doc_registry 元数据 + T1 enum 归并
# [Ref: 34_ §3.2 · 29_ §5.1 · 禁止 OpenSearch/BM25]
schema_version: "1.2"
probe_key: M.policy.sector_direction
doc_type: policy
scope_segment_a: S0
queries:
  - "人工智能 产业政策"
  - "新质生产力 规划"
  - "低空经济 试点"
  - "算力 基础设施"
  - "半导体 国产替代"
  - "节能降碳 改造"
  - "数据要素 数字经济"
  - "新能源汽车 以旧换新"
# 顺逆风 enum · T1 规则分类（启动期）· 扩展期可换 LLM enum
direction_rules:
  enum_values: [tailwind, headwind, neutral, mixed]
  tailwind:
    - "支持"
    - "加快"
    - "推动"
    - "鼓励"
    - "试点"
    - "规划"
    - "发展"
    - "建设"
    - "升级"
    - "扩容"
    - "培育"
    - "印发"
    - "实施方案"
    - "高质量发展"
    - "新质生产力"
  headwind:
    - "限制"
    - "禁止"
    - "整顿"
    - "退出"
    - "压减"
    - "严控"
    - "打击"
    - "取消"
    - "下调"
    - "约谈"
    - "违规"
    - "处罚"
# 单关键词过宽 · 易误命中标题噪音（如「走进金融机构」「卫星发射」）

# 顺逆风 enum · T1 规则分类（启动期）· 扩展期可换 LLM enum
direction_rules:
  enum_values: [tailwind, headwind, neutral, mixed]
  tailwind:
    - "支持"
    - "加快"
    - "推动"
    - "鼓励"
    - "试点"
    - "规划"
    - "发展"
    - "建设"
    - "升级"
    - "扩容"
    - "培育"
    - "印发"
    - "实施方案"
    - "高质量发展"
    - "新质生产力"
  headwind:
    - "限制"
    - "禁止"
    - "整顿"
    - "退出"
    - "压减"
    - "严控"
    - "打击"
    - "取消"
    - "下调"
    - "约谈"
    - "违规"
    - "处罚"

# Z0-M2 政策赛道 T1 LLM 语义工程化配置（v2.0）
# [Ref: 36_ §4/§7/§8/§11 · 34_ §3.2 M.policy.sector_direction]
# 模型选择、成本预算、三因子衰减、升格规则
schema_version: "2.0"
probe_key: M.policy.sector_direction

# --- 模型配置 ---
llm_config:
  default_model: "deepseek-chat"           # 日常轮询模型
  escalate_model: "claude-opus-4"          # 关键政策升格模型
  temperature: 0.1                         # 低温度保证一致性
  max_retries: 2                           # LLM 调用重试次数
  context_window_tokens: 8500              # 每篇总预算
  full_text_budget_tokens: 6000            # 正文分配

# --- 成本控制 ---
cost_control:
  daily_token_budget: 500000               # 每日 token 上限
  daily_yuan_budget: 5.0                   # 每日费用上限（¥）
  batch_mode: false                        # 是否 batch API（回填时开）
  pricing:
    deepseek-chat:
      input_per_1M_yuan: 1.0
      output_per_1M_yuan: 2.0
    claude-opus-4:
      input_per_1M_yuan: 15.0
      output_per_1M_yuan: 75.0

# --- 数据源权威权重（替换 doc_type_weights · 按具体 source 域名直接映射）---
source_authority:
  # 国务院直属（最高权威）
  gov.cn: 1.0                               # 国务院政策文件库 · 国发/国办文件
  # 核心经济综合部门
  ndrc.gov.cn: 0.95                         # 发改委 · 产业政策最高权威
  miit.gov.cn: 0.90                         # 工信部 · 工业/信息/通信/新兴产业
  # 重要经济职能部委
  pbc.gov.cn: 0.88                          # 央行 · 货币政策/金融稳定
  mof.gov.cn: 0.85                          # 财政部 · 财税政策
  # 专业领域部委
  most.gov.cn: 0.82                         # 科技部 · 研发/创新/卡脖子攻关
  mofcom.gov.cn: 0.80                       # 商务部 · 贸易/产业安全/反垄断
  csrc.gov.cn: 0.78                         # 证监会 · 资本市场改革
  nea.gov.cn: 0.82                          # 国家能源局 · 能源政策
  mee.gov.cn: 0.80                          # 生态环境部 · 环保/双碳/绿色转型
  mot.gov.cn: 0.78                          # 交通运输部 · 低空/自动驾驶/智慧交通
  moa.gov.cn: 0.78                          # 农业农村部 · 乡村振兴/粮食安全
  # 默认（未匹配到具体 source 时）
  default: 0.60

# --- 文档类型权重（已废弃，由 source_authority 替代 · 保留键名防止报错）---
doc_type_weights:
  _deprecated: true

# --- 实施状态乘数（36_ §5.1） ---
impl_status_multipliers:
  已发布_待执行: 1.0
  已执行_进行中: 0.8
  已执行_完成: 0.3
  征求意见稿: 0.5
  废止_替代: 0.0
  状态未知: 0.6

# --- 时间衰减（天，36_ §5.1） ---
time_decay:
  L0:
    full_weight_days: 180
    decay_to_days: 1825
    min_weight: 0.0
  L1:
    full_weight_days: 90
    decay_to_days: 1095
    min_weight: 0.0
  L2:
    full_weight_days: 0
    decay_to_days: 180
    min_weight: 0.0
  L3:
    full_weight_days: 0
    decay_to_days: 90
    min_weight: 0.0

# --- 升格触发 ---
escalation_rules:
  min_llm_confidence: 0.6                  # 置信度低于此值自动升格
  tier_l0_always_escalate: true            # L0 源始终用 Opus

# --- 影响评分阈值 ---
impact_thresholds:
  high: 61
  medium: 41
  low: 21

# --- 证据回检 ---
evidence_check:
  enabled: true
  norm_chinese: true
  strict_mode: false

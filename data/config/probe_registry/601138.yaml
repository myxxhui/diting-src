# 批推组索引（同 cache_group 在一次触发中合并处理）
batch_groups:
  fii-cninfo-dynamic:
    update_trigger: event_driven
    job_id: l3-fii-dynamic
    cache_kind: deepsea_context
    doc_types: [earnings_transcript, cninfo_announcement]
    probe_keys:
      - fii_gb200_milestone
      - fii_odm_direct_ratio
      - fii_liquid_attach
      - fii_ai_margin
      - r_fii_gb200_flaw
      - fii_gb200_yield
      - fii_overseas_fdi
      - fii_network_switch

  fii-earnings-q:
    update_trigger: event_driven
    job_id: l3-fii-financials-quarterly
    cache_kind: deepsea_context
    probe_keys:
      - fii_odm_direct_ratio
      - fii_liquid_attach
      - fii_ai_margin
      - fii_raw_inventory
      - fii_labor_auto_capex
      - fii_apple_base
      - fii_related_pty
      - r_fii_honhai_tunnel

  fii-earnings-q-hard:
    update_trigger: cron
    job_id: l3-fii-financials-quarterly
    cache_kind: tushare_api
    t0_source_id: tushare_fina_indicator
    probe_keys:
      - fii_gross_margin
      - fii_inventory_turnover
      - fii_ar_turnover
      - fii_contract_liab
      - fii_cfo_health
      - r_fii_ar_cycle_bad

  fii-risk-dynamic:
    update_trigger: event_driven
    job_id: l3-fii-dynamic
    cache_kind: deepsea_context
    model_tier: pro_required
    probe_keys:
      - r_fii_liquid_fail
      - r_fii_us_mexico_sanction

  jl4-moneyflow-eod:
    update_trigger: cron
    job_id: l4-smart-money-eod
    cache_kind: pg_table
    probe_keys:
      - smart_money_flow
      - level2_super_order

  jl4-liquidity-eod:
    update_trigger: cron
    job_id: l4-turnover-accel-eod
    cache_kind: pg_table
    probe_keys:
      - turnover_acceleration
      - retail_concentration
      - tech_beta_correlation

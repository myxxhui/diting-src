<style>
  /* Opus 全视口布局 · CSS 变量体系 */
  #opus-workspace-root {
    --opus-primary:        #7c3aed;
    --opus-primary-hover:  #6d28d9;
    --opus-primary-light:  #ede9fe;
    --opus-primary-border: #c4b5fd;
    --opus-surface:        #ffffff;
    --opus-bg:             #f9fafb;
    --opus-bg-alt:         #f3f4f6;
    --opus-border:         #e5e7eb;
    --opus-border-light:   #f3f4f6;
    --opus-text:           #111827;
    --opus-text-secondary: #6b7280;
    --opus-text-muted:     #9ca3af;
    --opus-shadow-sm:      0 1px 3px rgba(0,0,0,0.06);
    --opus-shadow-md:      0 4px 16px rgba(0,0,0,0.08);
    --opus-radius-sm:      6px;
    --opus-radius-md:      10px;
    --opus-radius-lg:      14px;
    --opus-radius-round:   999px;
    --opus-sidebar-w:      192px;
    --opus-text-xs:        11px;
    --opus-text-sm:        12px;
    --opus-text-base:      13px;
    --opus-text-lg:        14px;

    flex: 1; min-height: 0; width: 100%;
    display: flex; flex-direction: column;
    background: var(--opus-surface);
    overflow: hidden;
    isolation: isolate;
  }

  body:has(#opus-workspace-root) { overflow: hidden; height: 100dvh; }
  body:has(#opus-workspace-root) {
    --opus-nav-h: 52px;  /* ⚠️ 变量须在祖先层定义，body main 才能访问 */
  }
  body:has(#opus-workspace-root) main {
    width: 100%; min-width: 0; max-width: none; margin: 0; padding: 0;
    height: calc(100dvh - var(--opus-nav-h)); min-height: 0;
    display: flex; flex-direction: column; box-sizing: border-box;
    overflow: hidden; background: var(--opus-surface);
  }

  .opus-header-strip {
    flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 16px; padding: 6px 16px;
    border-bottom: 1px solid var(--opus-border);
    background: var(--opus-surface); min-height: 40px;
  }
  .opus-header-strip h1 {
    margin: 0; font-size: var(--opus-text-lg); font-weight: 700;
    color: var(--opus-text); display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .opus-header-strip h1 span { font-size: 10px; font-weight: 400; color: var(--opus-text-muted); }
  .opus-header-strip h1 a { color: var(--opus-primary); white-space: nowrap; }
  .opus-header-strip h1 a:hover { text-decoration: underline; }
  .opus-header-tabs {
    display: flex; gap: 4px; flex-shrink: 0;
    background: var(--opus-bg-alt); border-radius: var(--opus-radius-sm); padding: 3px;
  }
  .opus-mode-tab {
    padding: 5px 14px; border-radius: 5px; border: none;
    font-size: var(--opus-text-sm); font-weight: 600; cursor: pointer;
    transition: all 0.15s; background: transparent; color: var(--opus-text-secondary);
  }
  .opus-mode-tab:hover { color: var(--opus-text); }
  .opus-mode-tab.is-active {
    background: var(--opus-primary); color: #fff; box-shadow: var(--opus-shadow-sm);
  }

  /* ── 面板：flex 列，由 min-height:0+overflow:hidden 阻止撑破 ── */
  .opus-panel-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .opus-chat-shell {
    flex: 1; min-height: 0; min-width: 0; width: 100%;
    display: flex; flex-direction: row; overflow: hidden; background: var(--opus-bg);
  }

  .opus-sidebar {
    width: var(--opus-sidebar-w); flex-shrink: 0; min-height: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--opus-border); background: var(--opus-bg-alt);
  }
  .opus-sidebar-head {
    flex-shrink: 0; padding: 8px 10px;
    border-bottom: 1px solid var(--opus-border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .opus-sidebar-title { font-size: var(--opus-text-sm); font-weight: 600; color: var(--opus-text-secondary); }
  .opus-sidebar-list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .opus-session-item {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: var(--opus-radius-sm);
    border: 1px solid transparent; background: transparent; cursor: pointer;
    font-size: var(--opus-text-sm); color: var(--opus-text-secondary);
    line-height: 1.35; transition: background 0.12s, border-color 0.12s;
  }
  .opus-session-item:hover { background: var(--opus-border); }
  .opus-session-item.is-active {
    background: var(--opus-primary-light); border-color: var(--opus-primary-border);
    color: var(--opus-primary-hover); font-weight: 600;
  }
  .opus-session-meta {
    display: block; font-size: var(--opus-text-xs); color: var(--opus-text-muted);
    font-weight: 400; margin-top: 2px;
  }

  /* ── 主列：Grid 不要在 flex 子项上设 height:100% ── */
  .opus-main-column {
    flex: 1; min-width: 0; min-height: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "toolbar" "messages" "footer";
    overflow: hidden; background: var(--opus-surface);
  }

  .opus-toolbar {
    grid-area: toolbar; flex-shrink: 0; padding: 4px 14px;
    border-bottom: 1px solid var(--opus-border-light); background: var(--opus-surface);
  }
  .opus-toolbar-details { margin: 0; border: none; background: transparent; }
  .opus-toolbar-details summary {
    cursor: pointer; padding: 3px 0; font-size: var(--opus-text-sm);
    font-weight: 600; color: var(--opus-primary-hover); list-style: none; user-select: none;
  }
  .opus-toolbar-details summary::-webkit-details-marker { display: none; }
  .opus-toolbar-details[open] summary {
    margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--opus-border-light);
  }
  .opus-toolbar-inline {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    font-size: var(--opus-text-xs); color: var(--opus-text-secondary);
  }

  .opus-messages-scroll {
    grid-area: messages; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 12px 16px;
    background: linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
  }

  /* ── 消息气泡 · Opus 风格 ── */
  .opus-user-bubble {
    position: relative; word-break: break-word;
    animation: opus-bubble-in 0.28s ease-out;
  }
  .opus-user-bubble .msg-edit-btn {
    transition: opacity 0.15s, transform 0.15s;
  }
  .opus-user-bubble .msg-edit-btn:hover { transform: scale(1.1); }
  .opus-assistant-bubble {
    word-break: break-word; line-height: 1.65;
    animation: opus-bubble-in 0.32s ease-out;
  }
  @keyframes opus-bubble-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .opus-cost-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 500;
    color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .opus-cost-model {
    color: #9ca3af; font-weight: 400;
    padding-left: 4px; border-left: 1px solid #d1d5db; margin-left: 2px;
  }

  /* ── Markdown 渲染后微调（气泡内）── */
  .opus-assistant-bubble.prose p:first-child { margin-top: 0; }
  .opus-assistant-bubble.prose p:last-child  { margin-bottom: 0; }
  .opus-assistant-bubble.prose pre {
    margin: 0.5em 0; border-radius: 8px; background: #1e1e2e; color: #cdd6f4;
    font-size: 12px; line-height: 1.5; overflow-x: auto;
  }
  .opus-assistant-bubble.prose code {
    font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
  }
  .opus-assistant-bubble.prose pre code { background: transparent; padding: 0; }
  .opus-assistant-bubble.prose table {
    font-size: 12px; border-collapse: collapse; width: 100%; margin: 0.5em 0;
  }
  .opus-assistant-bubble.prose th,
  .opus-assistant-bubble.prose td { padding: 6px 10px; border: 1px solid #e5e7eb; }
  .opus-assistant-bubble.prose th { background: #f9fafb; font-weight: 600; color: #374151; }

  .opus-bottom-dock { grid-area: footer; flex-shrink: 0; border-top: 1px solid var(--opus-border); background: var(--opus-surface); }
  .opus-templates-inline { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 14px 0; background: #fafafa; }
  details.opus-tpl-chip {
    flex: 1 1 auto; min-width: 160px; margin: 0;
    border: 1px solid var(--opus-border); border-radius: var(--opus-radius-sm);
    background: var(--opus-surface); font-size: var(--opus-text-xs);
  }
  details.opus-tpl-chip summary {
    cursor: pointer; padding: 4px 10px; color: var(--opus-text-secondary);
    list-style: none; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  details.opus-tpl-chip summary::-webkit-details-marker { display: none; }
  details.opus-tpl-chip[open] { border-color: var(--opus-primary-border); }
  details.opus-tpl-chip[open] summary {
    color: var(--opus-primary-hover); font-weight: 600; border-bottom: 1px solid var(--opus-border-light);
  }
  .opus-tpl-body { padding: 6px 8px 8px; }
  .opus-tpl-body textarea {
    width: 100%; border: 1px solid var(--opus-border); border-radius: var(--opus-radius-sm);
    padding: 6px 10px; font-size: var(--opus-text-sm); line-height: 1.4;
    resize: vertical; min-height: 48px; max-height: 100px; box-sizing: border-box; background: #fafafa;
  }
  .opus-tpl-hint { font-size: var(--opus-text-xs); color: var(--opus-text-muted); margin-top: 3px; }

  .opus-composer { padding: 8px 14px 10px; background: var(--opus-surface); }
  .opus-composer-box {
    display: flex; align-items: flex-end; gap: 6px; width: 100%;
    padding: 2px 3px 2px 14px; border: 1.5px solid var(--opus-border);
    border-radius: var(--opus-radius-lg); background: var(--opus-bg);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .opus-composer-box:focus-within {
    border-color: var(--opus-primary);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.1); background: var(--opus-surface);
  }
  .opus-composer-box textarea {
    flex: 1; border: none; outline: none; resize: none;
    padding: 7px 0; font-size: var(--opus-text-base); line-height: 1.5;
    max-height: 120px; min-height: 22px; background: transparent; color: var(--opus-text);
  }
  .opus-composer-box textarea::placeholder { color: var(--opus-text-muted); }
  .opus-composer-send {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--opus-primary); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.12s;
  }
  .opus-composer-send:hover { background: var(--opus-primary-hover); }

  .opus-assistant-bubble { position: relative; }
  .opus-msg-menu { position: relative; }
  .opus-msg-menu-trigger {
    list-style: none; cursor: pointer; width: 28px; height: 28px;
    border-radius: var(--opus-radius-sm); border: 1px solid transparent;
    background: transparent; color: var(--opus-text-muted);
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .opus-msg-menu-trigger::-webkit-details-marker { display: none; }
  .opus-msg-menu-trigger:hover,
  .opus-msg-menu[open] .opus-msg-menu-trigger {
    background: var(--opus-bg-alt); border-color: var(--opus-border); color: var(--opus-text-secondary);
  }
  .opus-msg-menu-panel {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 1;
    min-width: 176px; padding: 6px; border-radius: var(--opus-radius-md);
    border: 1px solid var(--opus-border); background: var(--opus-surface); box-shadow: var(--opus-shadow-md);
  }
  .opus-msg-menu-item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    width: 100%; padding: 8px 10px; border: none; border-radius: 7px;
    background: transparent; color: var(--opus-text-secondary);
    font-size: var(--opus-text-sm); text-align: left; text-decoration: none; cursor: pointer; line-height: 1.3;
  }
  .opus-msg-menu-item:hover:not(.is-disabled) {
    background: var(--opus-primary-light); color: var(--opus-primary-hover);
  }
  .opus-msg-menu-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
  .opus-msg-menu-icon { flex-shrink: 0; width: 1.1em; text-align: center; }
  .opus-msg-menu-hint { flex: 1 1 100%; font-size: var(--opus-text-xs); color: var(--opus-text-muted); padding-left: 1.6em; font-weight: 400; }
  .opus-pin-toast:not(.hidden) { animation: opus-toast-in 0.2s ease; }
  @keyframes opus-toast-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

  /* ── 面板显隐（不用 height:100%，让 flex:1 计算）── */
  #opus-panel-chat.hidden { display: none; }
  #opus-panel-chat:not(.hidden) { flex: 1; min-height: 0; display: flex; }
  #opus-panel-t2.hidden { display: none; }
  #opus-panel-t2:not(.hidden) {
    flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; width: 100%;
    overflow: hidden;  /* ⚠️ 阻止 HTMX 注入的 T2 内容撑破视口 */
  }
  #opus-t2-panel-slot {
    flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; width: 100%;
    overflow: hidden;  /* ⚠️ 同上 */
  }

  @media (max-width: 768px) {
    body:has(#opus-workspace-root) { position: fixed; inset: 0; width: 100%; }
    body:has(#opus-workspace-root) main {
      height: calc(100dvh - var(--opus-nav-h)); max-height: calc(100dvh - var(--opus-nav-h));
    }
    .opus-header-strip { padding: 4px 10px; gap: 6px 10px; }
    .opus-header-strip h1 { font-size: var(--opus-text-base); }
    .opus-chat-shell { flex-direction: column; }

    /* ── 移动端侧边栏：展开为标的 + 话题双模式（高度自适应）── */
    .opus-sidebar {
      width: 100%; max-height: none; flex-direction: column; align-items: stretch;
      border-right: none; border-bottom: 1px solid var(--opus-border); flex-shrink: 0;
      min-height: auto;
    }
    .opus-sidebar-head { border-bottom: 1px solid var(--opus-border); border-right: none; flex-shrink: 0; padding: 6px 10px; }
    .opus-sidebar-head .opus-sidebar-title { display: inline; }
    .opus-sidebar-list {
      flex-direction: row; gap: 4px; overflow-x: auto; overflow-y: hidden;
      flex: 0 0 auto; min-height: 0; padding: 6px 8px; max-height: 58px;
    }
    .opus-session-item { flex: 0 0 auto; width: auto; min-width: 72px; max-width: 120px; white-space: nowrap; }
    .opus-session-meta { display: none; }
    .opus-main-column { flex: 1; min-height: 0; }
    .opus-bottom-dock { padding-bottom: env(safe-area-inset-bottom,0px); box-shadow: 0 -2px 8px rgba(0,0,0,0.06); }
    .opus-composer-box textarea { max-height: 80px; }
    .opus-templates-inline { flex-direction: column; }
    details.opus-tpl-chip[open] { flex: 1 1 100%; }

    /* ── 移动端工具栏：标的复选框列表始终展开、触控友好 ── */
    .opus-toolbar { padding: 6px 10px; }
    .opus-toolbar-details summary { padding: 4px 0; font-size: var(--opus-text-sm); }
    .opus-toolbar-details[open] { padding-bottom: 4px; }
    .opus-toolbar-inline {
      gap: 6px 10px; font-size: 9px;
      flex-direction: column; align-items: flex-start;
    }
    /* 标的复选框网格 · 移动端 2 列自适应 · 触控尺寸 ≥44px */
    .t2-symbol-check-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px; max-height: 160px; overflow-y: auto; padding-right: 4px;
    }
    .t2-symbol-check-grid label {
      padding: 6px 8px !important; gap: 5px !important;
      font-size: 11px !important; border-radius: 8px !important;
      min-height: 40px; align-items: center;
    }
    .t2-symbol-check-grid input[type="checkbox"] {
      width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--opus-primary);
    }
    .t2-symbol-check-grid .t2-sym-name {
      max-width: none !important; white-space: normal; word-break: break-word;
      line-height: 1.3; font-size: 10px;
    }

    /* ── 移动端气泡回复内容 · 卡片缩窄 ── */
    .opus-messages-scroll { padding: 8px 10px; }
    .opus-assistant-bubble { font-size: 12px; }
    .opus-user-bubble { font-size: 12px; }
    /* T2 回复英雄区 · 移动端换行 */
    .t2-reply-hero { padding: 10px 12px; gap: 6px 10px; }
    .t2-reply-summary { font-size: var(--opus-text-base); line-height: 1.45; }
    .t2-reply-action-badge { font-size: 10px; padding: 4px 10px; }
    .t2-reply-section { padding: 8px 12px; }
    .t2-reply-section-title { font-size: 10px; }
    .t2-reply-section-body { font-size: 11px; }
    /* 目标筹码 · 移动端 2 列 */
    .t2-target-chips { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .t2-target-chip { padding: 6px 8px; }
    .t2-target-sym { font-size: 10px; }
    .t2-target-rat { font-size: 10px; line-height: 1.35; }
    /* 九维网格 · 移动端 1 列 */
    .t2-nine-dim-grid { grid-template-columns: 1fr; gap: 4px; }
    .t2-nine-dim-card { font-size: 10px; }
    .t2-nine-dim-summary { padding: 5px 6px; }
    .t2-nine-dim-body { padding: 0 6px 6px; font-size: 10px; }
    /* 标的卡片 · 移动端优化 */
    .t2-symbol-card { margin-bottom: 6px; }
    .t2-symbol-summary { padding: 8px 10px; gap: 6px; }
    .t2-symbol-title { font-size: 12px; }
    .t2-symbol-body { padding: 0 10px 10px; }
    /* 分段 */
    .t2-segment { padding: 6px 8px; }
    .t2-segment-title { font-size: 11px; }
    .t2-segment-body { font-size: 11px; }
    /* 移动端消息菜单面板 · 避免超出屏幕 */
    .opus-msg-menu-panel { right: auto; left: 0; min-width: 150px; }
    /* 移动端费用药丸 */
    .opus-cost-pill { font-size: 9px; padding: 2px 6px; }
    /* 移动端代码块微调 */
    .opus-assistant-bubble.prose pre { font-size: 10px; max-height: 200px; overflow-y: auto; }
    .opus-assistant-bubble.prose code { font-size: 10px; }
    .opus-assistant-bubble.prose table { font-size: 10px; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .opus-assistant-bubble.prose th,
    .opus-assistant-bubble.prose td { padding: 4px 6px; }

    /* ── 移动端 T2 标的列表侧栏（话题列表之上展示持仓标的）── */
    .opus-sidebar-symbol-strip {
      flex-shrink: 0; display: flex; flex-direction: column;
      border-bottom: 1px solid var(--opus-border); background: var(--opus-bg);
      padding: 6px 8px; gap: 4px;
    }
    .opus-sidebar-symbol-strip-title {
      font-size: 9px; font-weight: 700; color: var(--opus-text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin: 0;
    }
    .opus-sidebar-symbol-strip-scroll {
      display: flex; flex-direction: row; gap: 4px; overflow-x: auto; overflow-y: hidden;
      padding-bottom: 2px;
    }
    .opus-sidebar-symbol-btn {
      flex: 0 0 auto; padding: 4px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 600; font-family: ui-monospace, monospace;
      border: 1px solid var(--opus-border); background: var(--opus-surface);
      color: var(--opus-text-secondary); cursor: pointer; white-space: nowrap;
      min-height: 32px; display: flex; align-items: center; gap: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .opus-sidebar-symbol-btn:active,
    .opus-sidebar-symbol-btn.is-active {
      background: var(--opus-primary-light); border-color: var(--opus-primary-border);
      color: var(--opus-primary-hover);
    }
    /* 侧边栏分隔 */
    .opus-sidebar-sep { width: 100%; height: 1px; background: var(--opus-border); flex-shrink: 0; }
  }

  /* T2 回复排版 */
  #t2-analyst-messages .opus-assistant-bubble { max-width: min(920px, 100%); width: 100%; }
  .opus-assistant-body.t2-assistant-body { padding: 12px 14px; font-size: var(--opus-text-base); line-height: 1.55; color: var(--opus-text); }
  .t2-analyst-result { width: 100%; }
  .t2-analyst-result--compact .t2-reply-portfolio,
  .t2-analyst-result--structured .t2-reply-portfolio { margin-bottom: 10px; }
  .t2-reply-portfolio { border: 1px solid #bbf7d0; border-radius: var(--opus-radius-md); background: linear-gradient(180deg,#f0fdf4 0%,var(--opus-surface) 100%); overflow: hidden; }
  .t2-reply-hero { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 14px; padding: 12px 14px; border-bottom: 1px solid #dcfce7; }

<style>
  /* ── Opus 全视口布局 · CSS 变量体系 · 响应式断点: <768px 移动端 / >=768px PC端 ── */
  #opus-workspace-root {
    --opus-primary:        #7c3aed;
    --opus-primary-hover:  #6d28d9;
    --opus-primary-light:  #ede9fe;
    --opus-primary-border: #c4b5fd;
    --opus-surface:        #ffffff;
    --opus-bg:             #f9fafb;
    --opus-bg-alt:         #f3f4f6;
    --opus-border:         #e5e7eb;
    --opus-border-light:   #f3f4f6;
    --opus-text:           #111827;
    --opus-text-secondary: #6b7280;
    --opus-text-muted:     #9ca3af;
    --opus-shadow-sm:      0 1px 3px rgba(0,0,0,0.06);
    --opus-shadow-md:      0 4px 16px rgba(0,0,0,0.08);
    --opus-shadow-lg:      0 10px 40px rgba(0,0,0,0.12);
    --opus-radius-sm:      6px;
    --opus-radius-md:      10px;
    --opus-radius-lg:      14px;
    --opus-radius-round:   999px;
    --opus-sidebar-w:      240px;
    --opus-text-xs:        11px;
    --opus-text-sm:        12px;
    --opus-text-base:      13px;
    --opus-text-lg:        14px;

    flex: 1; min-height: 0; width: 100%;
    display: flex; flex-direction: column;
    background: var(--opus-bg);
    overflow: hidden;
    isolation: isolate;
  }

  body:has(#opus-workspace-root) { overflow: hidden; height: 100dvh; }
  body:has(#opus-workspace-root) {
    --opus-nav-h: 52px;
  }
  body:has(#opus-workspace-root) main {
    width: 100%; min-width: 0; max-width: none; margin: 0; padding: 0;
    height: calc(100dvh - var(--opus-nav-h)); min-height: 0;
    display: flex; flex-direction: column; box-sizing: border-box;
    overflow: hidden; background: var(--opus-bg);
  }

  /* ── Header Strip · 汉堡按钮 ── */
  .opus-header-strip {
    flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 16px; padding: 6px 16px;
    border-bottom: 1px solid var(--opus-border);
    background: var(--opus-surface); min-height: 40px;
  }
  .opus-header-strip h1 {
    margin: 0; font-size: var(--opus-text-lg); font-weight: 700;
    color: var(--opus-text); display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .opus-header-strip h1 span { font-size: 10px; font-weight: 400; color: var(--opus-text-muted); }
  .opus-header-strip h1 a { color: var(--opus-primary); white-space: nowrap; }
  .opus-header-strip h1 a:hover { text-decoration: underline; }
  .opus-header-tabs {
    display: flex; gap: 4px; flex-shrink: 0;
    background: var(--opus-bg-alt); border-radius: var(--opus-radius-sm); padding: 3px;
  }
  .opus-mode-tab {
    padding: 5px 14px; border-radius: 5px; border: none;
    font-size: var(--opus-text-sm); font-weight: 600; cursor: pointer;
    transition: all 0.15s; background: transparent; color: var(--opus-text-secondary);
  }
  .opus-mode-tab:hover { color: var(--opus-text); }
  .opus-mode-tab.is-active {
    background: var(--opus-primary); color: #fff; box-shadow: var(--opus-shadow-sm);
  }
  .opus-hamburger {
    display: none; flex-shrink: 0; width: 32px; height: 32px;
    align-items: center; justify-content: center;
    border: 1px solid var(--opus-border); border-radius: var(--opus-radius-sm);
    background: var(--opus-surface); cursor: pointer; color: var(--opus-text-secondary);
    margin-right: auto; font-size: 16px; line-height: 1;
  }
  .opus-hamburger:hover { background: var(--opus-bg-alt); }

  /* ── 面板 ── */
  .opus-panel-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .opus-chat-shell {
    flex: 1; min-height: 0; min-width: 0; width: 100%;
    display: flex; flex-direction: row; overflow: hidden;
  }

  /* ── 侧边栏 ── */
  .opus-sidebar {
    width: var(--opus-sidebar-w); flex-shrink: 0; min-height: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--opus-border); background: var(--opus-surface);
  }
  .opus-sidebar-head {
    flex-shrink: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    border-bottom: 1px solid var(--opus-border);
  }
  .opus-sidebar-title { font-size: var(--opus-text-sm); font-weight: 600; color: var(--opus-text-secondary); }
  .opus-sidebar-new-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; padding: 7px 12px; border: 1px solid var(--opus-primary);
    border-radius: var(--opus-radius-sm); background: var(--opus-primary);
    color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; box-shadow: 0 1px 3px rgba(124,58,237,0.2);
  }
  .opus-sidebar-new-btn:hover {
    background: var(--opus-primary-hover); border-color: var(--opus-primary-hover);
    box-shadow: 0 2px 6px rgba(124,58,237,0.35); transform: translateY(-1px);
  }
  .opus-sidebar-list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .opus-session-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; padding: 8px 10px;
    border-radius: var(--opus-radius-sm); border: 1px solid transparent;
    background: transparent; cursor: pointer; gap: 4px;
    transition: background 0.12s, border-color 0.12s;
  }
  .opus-session-item:hover { background: var(--opus-bg); }
  .opus-session-item.is-active {
    background: var(--opus-primary-light); border-color: var(--opus-primary-border);
  }
  .opus-session-item .opus-session-title {
    flex: 1; min-width: 0; font-size: var(--opus-text-sm);
    color: var(--opus-text-secondary); line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: block;
  }
  .opus-session-item.is-active .opus-session-title {
    color: var(--opus-primary-hover); font-weight: 600;
  }
  .opus-session-meta {
    display: block; font-size: 10px; color: var(--opus-text-muted);
    font-weight: 400; margin-top: 1px;
  }
  /* 删除按钮在 session item 内 */
  .opus-session-del {
    flex-shrink: 0; font-size: 10px; color: var(--opus-text-muted);
    padding: 2px 4px; border-radius: 4px; border: none; background: transparent; cursor: pointer;
    line-height: 1; opacity: 0; transition: opacity 0.12s, color 0.12s;
  }
  .opus-session-item:hover .opus-session-del { opacity: 1; }
  .opus-session-del:hover { color: #ef4444; background: #fef2f2; }

  /* ── 主列 Grid ── */
  .opus-main-column {
    flex: 1; min-width: 0; min-height: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "toolbar" "messages" "footer";
    overflow: hidden; background: var(--opus-bg);
  }

  .opus-toolbar {
    grid-area: toolbar; flex-shrink: 0; padding: 6px 14px;
    border-bottom: 1px solid var(--opus-border); background: var(--opus-surface);
  }
  .opus-toolbar-details { margin: 0; border: none; background: transparent; }
  .opus-toolbar-details summary {
    cursor: pointer; padding: 3px 0; font-size: var(--opus-text-sm);
    font-weight: 600; color: var(--opus-primary-hover); list-style: none; user-select: none;
  }
  .opus-toolbar-details summary::-webkit-details-marker { display: none; }
  .opus-toolbar-details[open] summary {
    margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--opus-border-light);
  }
  .opus-toolbar-inline {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    font-size: var(--opus-text-xs); color: var(--opus-text-secondary);
  }

  /* ── 消息区 · 空状态 ── */
  .opus-messages-scroll {
    grid-area: messages; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 12px 16px;
  }
  .opus-empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; text-align: center; gap: 24px; padding: 20px;
  }
  .opus-empty-state-logo {
    font-size: 36px; line-height: 1; opacity: 0.85;
  }
  .opus-empty-state-title {
    font-size: 18px; font-weight: 700; color: var(--opus-text); margin: 0;
  }
  .opus-empty-state-sub {
    font-size: var(--opus-text-sm); color: var(--opus-text-muted); max-width: 320px; line-height: 1.5;
  }
  .opus-empty-prompts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px; width: 100%; max-width: 600px;
  }
  .opus-empty-prompt-card {
    padding: 14px 16px; border: 1px solid var(--opus-border);
    border-radius: var(--opus-radius-md); background: var(--opus-surface);
    text-align: left; cursor: pointer; transition: all 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .opus-empty-prompt-card:hover {
    border-color: var(--opus-primary-border); background: var(--opus-primary-light);
    box-shadow: 0 2px 8px rgba(124,58,237,0.08); transform: translateY(-1px);
  }
  .opus-empty-prompt-icon { font-size: 14px; margin-bottom: 6px; }
  .opus-empty-prompt-text { font-size: var(--opus-text-sm); color: var(--opus-text-secondary); line-height: 1.4; font-weight: 500; }

  /* ── 消息气泡 · Opus 风格 ── */
  .opus-user-bubble {
    position: relative; word-break: break-word;
    animation: opus-bubble-in 0.28s ease-out;
  }
  .opus-user-bubble .msg-edit-btn {
    transition: opacity 0.15s, transform 0.15s;
  }
  .opus-user-bubble .msg-edit-btn:hover { transform: scale(1.1); }
  .opus-assistant-bubble {
    word-break: break-word; line-height: 1.65;
    animation: opus-bubble-in 0.32s ease-out;
  }
  @keyframes opus-bubble-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .opus-cost-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 500;
    color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .opus-cost-model {
    color: #9ca3af; font-weight: 400;
    padding-left: 4px; border-left: 1px solid #d1d5db; margin-left: 2px;
  }

  /* ── Markdown 渲染微调 ── */
  .opus-assistant-bubble.prose p:first-child { margin-top: 0; }
  .opus-assistant-bubble.prose p:last-child  { margin-bottom: 0; }
  .opus-assistant-bubble.prose pre {
    margin: 0.5em 0; border-radius: 8px; background: #1e1e2e; color: #cdd6f4;
    font-size: 12px; line-height: 1.5; overflow-x: auto;
  }
  .opus-assistant-bubble.prose code {
    font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
  }
  .opus-assistant-bubble.prose pre code { background: transparent; padding: 0; }
  .opus-assistant-bubble.prose table {
    font-size: 12px; border-collapse: collapse; width: 100%; margin: 0.5em 0;
  }
  .opus-assistant-bubble.prose th,
  .opus-assistant-bubble.prose td { padding: 6px 10px; border: 1px solid #e5e7eb; }
  .opus-assistant-bubble.prose th { background: #f9fafb; font-weight: 600; color: #374151; }

  /* ── 底部输入区 ── */
  .opus-bottom-dock {
    grid-area: footer; flex-shrink: 0;
    padding: 8px 14px 12px; background: var(--opus-bg);
  }
  .opus-composer {
    background: var(--opus-surface); border-radius: var(--opus-radius-lg);
    box-shadow: var(--opus-shadow-lg); border: 1px solid var(--opus-border);
    overflow: hidden;
  }
  .opus-composer-tool-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 6px 14px 0; font-size: 10px; color: var(--opus-text-muted);
    border-bottom: 1px solid var(--opus-border-light);
  }
  .opus-composer-tool-strip details {
    margin: 0; border: none; background: transparent; font-size: 10px;
  }
  .opus-composer-tool-strip summary {
    cursor: pointer; color: var(--opus-text-muted); list-style: none;
    padding: 2px 8px; border-radius: 4px; border: 1px solid transparent;
    transition: all 0.12s;
  }
  .opus-composer-tool-strip summary:hover { color: var(--opus-primary-hover); background: var(--opus-primary-light); border-color: var(--opus-primary-border); }
  .opus-composer-tool-strip summary::-webkit-details-marker { display: none; }
  .opus-composer-tool-strip details[open] summary { color: var(--opus-primary-hover); font-weight: 600; background: var(--opus-primary-light); border-color: var(--opus-primary-border); }
  .opus-composer-jl13-body { padding: 6px 8px 8px; }
  .opus-composer-jl13-body textarea {
    width: 100%; border: 1px solid var(--opus-border); border-radius: var(--opus-radius-sm);
    padding: 6px 10px; font-size: 11px; line-height: 1.4; resize: vertical;
    min-height: 44px; max-height: 100px; box-sizing: border-box; background: #fafafa;
  }
  .opus-composer-box {
    display: flex; align-items: flex-end; gap: 8px; width: 100%;
    padding: 6px 10px 6px 16px; background: var(--opus-surface);
  }
  .opus-composer-box textarea {
    flex: 1; border: none; outline: none; resize: none;
    padding: 7px 0; font-size: var(--opus-text-base); line-height: 1.5;
    max-height: 200px; min-height: 24px; background: transparent; color: var(--opus-text);
  }
  .opus-composer-box textarea::placeholder { color: var(--opus-text-muted); }
  .opus-composer-send {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--opus-primary); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.12s, transform 0.12s;
  }
  .opus-composer-send:hover { background: var(--opus-primary-hover); transform: scale(1.05); }

  /* ── 标的输入行（PC 横向 / 移动端含触发按钮）── */
  .opus-symbol-row {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .opus-symbol-sheet-btn {
    display: none; /* PC 默认隐藏，移动端通过 JS 展示 */
    flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--opus-radius-sm);
    border: 1px solid var(--opus-border); background: var(--opus-bg);
    cursor: pointer; font-size: 16px; line-height: 1;
    align-items: center; justify-content: center;
    color: var(--opus-text-secondary);
  }
  .opus-symbol-sheet-btn:hover { background: var(--opus-primary-light); border-color: var(--opus-primary-border); }

  /* ── 多标芯片输入 ── */
  .opus-multi-chip-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  }
  .opus-chip-wrap {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  }
  .opus-chip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px 2px 8px; border-radius: 4px;
    background: var(--opus-primary-light); border: 1px solid var(--opus-primary-border);
    font-size: 10px; font-weight: 600; color: var(--opus-primary-hover);
    line-height: 1.4; white-space: nowrap;
  }
  .opus-chip-remove {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%; border: none;
    background: transparent; color: var(--opus-primary-hover); cursor: pointer;
    font-size: 10px; line-height: 1; padding: 0;
    transition: all 0.1s;
  }
  .opus-chip-remove:hover { background: var(--opus-primary); color: #fff; }
  .opus-chip-add-btn {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 4px;
    border: 1px dashed var(--opus-border); background: transparent;
    cursor: pointer; font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--opus-text-muted); transition: all 0.12s;
  }
  .opus-chip-add-btn:hover { border-color: var(--opus-primary); color: var(--opus-primary); background: var(--opus-primary-light); }

  /* ── 面板显隐 ── */
  #opus-panel-chat.hidden { display: none; }
  #opus-panel-chat:not(.hidden) { flex: 1; min-height: 0; display: flex; }
  #opus-panel-t2.hidden { display: none; }
  #opus-panel-t2:not(.hidden) {
    flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; width: 100%;
    overflow: hidden;
  }
  #opus-t2-panel-slot {
    flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; width: 100%;
    overflow: hidden;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     📱 移动端 (< 768px)
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  @media (max-width: 767px) {
    body:has(#opus-workspace-root) { position: fixed; inset: 0; width: 100%; }
    body:has(#opus-workspace-root) main {
      height: calc(100dvh - var(--opus-nav-h)); max-height: calc(100dvh - var(--opus-nav-h));
    }

    /* ── 修复 iOS 自动放大 · 所有表单元素 ≥16px ── */
    #opus-workspace-root input,
    #opus-workspace-root select,
    #opus-workspace-root textarea {
      font-size: 16px !important;
    }

    .opus-header-strip {
      padding: 4px 10px; gap: 6px 10px;
      justify-content: space-between;
    }
    .opus-header-strip h1 { font-size: var(--opus-text-base); }
    .opus-hamburger { display: flex; }

    /* 侧边栏 → Drawer */
    .opus-sidebar {
      position: fixed; top: 0; left: -280px; z-index: 150;
      width: 270px; height: 100dvh; max-height: 100dvh;
      border-right: 1px solid var(--opus-border);
      background: var(--opus-surface); box-shadow: var(--opus-shadow-lg);
      transition: left 0.25s ease;
    }
    .opus-sidebar.is-open { left: 0; }

    /* Drawer Overlay */
    .opus-sidebar-overlay {
      display: none; position: fixed; inset: 0; z-index: 140;
      background: rgba(0,0,0,0.35);
    }
    .opus-sidebar-overlay.is-active { display: block; }

    .opus-chat-shell { flex-direction: column; }
    .opus-main-column { flex: 1; min-height: 0; }

    .opus-toolbar { padding: 6px 10px; }
    .opus-toolbar-details summary { padding: 4px 0; font-size: var(--opus-text-sm); }
    /* ── 移动端表单：上下结构 + 满宽触控 ── */
    .opus-toolbar-inline {
      gap: 8px 0; font-size: 12px;
      flex-direction: column; align-items: stretch;
    }
    .opus-toolbar-inline > label {
      display: flex; flex-direction: column; gap: 3px;
      width: 100%; padding: 6px 0;
    }
    .opus-toolbar-inline > label > input,
    .opus-toolbar-inline > label > select {
      width: 100%; min-height: 38px; box-sizing: border-box;
      font-size: 16px !important; /* iOS zoom fix */
    }
    /* ── 数据开关复选框 → 卡片式网格 ── */
    .opus-toolbar-inline .opus-force-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      width: 100%; padding: 4px 0;
    }
    .opus-toolbar-inline .opus-force-grid .opus-force-card {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 8px; border: 1px solid var(--opus-border);
      border-radius: var(--opus-radius-sm); background: var(--opus-bg);
      cursor: pointer; user-select: none; transition: all 0.12s;
      min-height: 36px; font-size: 13px; font-weight: 500; color: var(--opus-text-secondary);
      -webkit-tap-highlight-color: transparent;
    }
    .opus-toolbar-inline .opus-force-grid .opus-force-card.is-checked {
      border-color: var(--opus-primary); background: var(--opus-primary-light);
      color: var(--opus-primary-hover); font-weight: 600;
    }
    .opus-toolbar-inline .opus-force-grid .opus-force-card input {
      display: none; /* hidden native checkbox */
    }
    /* ── 标的输入行 + 底部面板触发按钮 ── */
    .opus-symbol-row {
      display: flex; align-items: center; gap: 4px;
    }
    .opus-symbol-row input { flex: 1; }
    .opus-symbol-sheet-btn {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: var(--opus-radius-sm);
      border: 1px solid var(--opus-border); background: var(--opus-bg);
      cursor: pointer; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--opus-text-secondary); -webkit-tap-highlight-color: transparent;
    }
    .opus-symbol-sheet-btn:hover { background: var(--opus-primary-light); border-color: var(--opus-primary-border); }

    .opus-messages-scroll { padding: 8px 10px; }
    .opus-assistant-bubble { font-size: 12px; }
    .opus-user-bubble { font-size: 12px; }

    .opus-empty-prompts { grid-template-columns: 1fr; gap: 8px; }
    .opus-empty-prompt-card { padding: 12px 14px; }
    .opus-empty-prompt-text { font-size: 11px; }

    .opus-bottom-dock {
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
      /* ⚠️ 移动端键盘不遮挡：不使用 fixed，跟随文档流 */
    }
    .opus-composer { box-shadow: 0 -2px 12px rgba(0,0,0,0.08); }
    .opus-composer-box { padding: 4px 8px 4px 12px; }
    .opus-composer-box textarea { max-height: 120px; font-size: 16px !important; /* 防止 iOS 缩放 */ }
    .opus-composer-tool-strip { padding: 4px 10px 0; gap: 4px 8px; }

{% extends "base.html" %}
{% block title %}基础数据面板 - AI 投资副驾驶{% endblock %}
{% block head %}
<style>
  .tab-btn {
    padding: 8px 16px;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 6px 6px 0 0;
    transition: all 0.15s ease;
    cursor: pointer;
    border: none;
    outline: none;
  }
  .tab-btn.active {
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    border-bottom: 3px solid #3730a3;
  }
  .tab-btn:not(.active) {
    background: #f3f4f6;
    color: #6b7280;
  }
  .tab-btn:not(.active):hover {
    background: #e5e7eb;
    color: #374151;
  }
  .stat-card { background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 16px; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #111827; }
  .stat-label { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }
  .source-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
  .source-badge.L0 { background: #f3e8ff; color: #6b21a8; }
  .source-badge.L1 { background: #dbeafe; color: #1e40af; }
</style>
{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- 导航标题 -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">基础数据面板</h1>
    <div class="flex gap-2">
      <button type="button"
              class="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
              hx-post="/api/strategic/z0/collect/run?job_id=z0-policy-ingest"
              hx-target="#policy-admin-content"
              hx-swap="innerHTML"
              hx-trigger="click">
        ⟳ 执行 T0 采集
      </button>
    </div>
  </div>

  <!-- 导航 Tabs -->
  <div class="flex border-b border-gray-200 gap-0.5" id="policy-admin-tabs">
    <button id="tab-sources" class="tab-btn active" hx-get="/api/z0/policy/admin/sources" hx-target="#policy-admin-content" hx-swap="innerHTML">📊 数据源总览</button>
    <button id="tab-documents" class="tab-btn" hx-get="/api/z0/policy/admin/documents" hx-target="#policy-admin-content" hx-swap="innerHTML">📄 文档浏览器</button>
    <button id="tab-matrix" class="tab-btn" hx-get="/api/z0/policy/admin/matrix" hx-target="#policy-admin-content" hx-swap="innerHTML">🔗 赛道×数据源</button>
    <button id="tab-timeline" class="tab-btn" hx-get="/api/z0/policy/admin/timeline" hx-target="#policy-admin-content" hx-swap="innerHTML">📅 事件时间线</button>
  </div>

  <!-- 主内容区 -->
  <div id="policy-admin-content"
       hx-get="/api/z0/policy/admin/sources"
       hx-trigger="load"
       class="min-h-[400px]">
    <div class="text-center py-12 text-gray-400 text-sm">加载中...</div>
  </div>
</div>

<script>
  // ── 统一的 Tab 状态管理 ──
  // 原则：所有 Tab 高亮由 URL 自动判定，任何地方都不再手动改 class

  function tabIdFromPath(path) {
    if (!path) return 'sources';
    if (path.includes('/documents') || path.includes('/document/')) return 'documents';
    if (path.includes('/matrix')) return 'matrix';
    if (path.includes('/timeline')) return 'timeline';
    if (path.includes('/sources')) return 'sources';
    return 'sources';
  }

  function switchTab(tabId) {
    var tabs = document.querySelectorAll('#policy-admin-tabs .tab-btn');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.remove('active');
    }
    var target = document.getElementById('tab-' + tabId);
    if (target) {
      target.classList.add('active');
      // 仅当本次调用来自 Tab 按钮的直接点击时，才触发 hx-get
      // 否则（来自 afterSwap 回调）只更新视觉状态，避免重复请求
    }
  }

  // Tab 按钮点击：更新视觉 + 由 hx-get 自动发起请求
  document.getElementById('policy-admin-tabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    // 先清全部高亮，再亮当前
    var tabs = document.querySelectorAll('#policy-admin-tabs .tab-btn');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    btn.classList.add('active');
    // hx-get 由 HTMX 自动处理，不需要额外操作
  });

  // 响应加载完成：根据请求 URL 自动修正 Tab 高亮
  document.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target.id !== 'policy-admin-content') return;
    try {
      var url = e.detail.requestConfig.path;
      var tabId = tabIdFromPath(url);
      // 只在当前高亮与实际不符时才更新（避免闪烁）
      var current = document.querySelector('#policy-admin-tabs .tab-btn.active');
      if (!current || current.id !== 'tab-' + tabId) {
        switchTab(tabId);
      }
    } catch (_) {}
  });

  // 页面初始加载后修正（处理浏览器前进后退）
  document.addEventListener('htmx:afterSettle', function(e) {
    if (e.detail.target.id !== 'policy-admin-content') return;
    try {
      var url = e.detail.requestConfig.path;
      var tabId = tabIdFromPath(url);
      switchTab(tabId);
    } catch (_) {}
  });
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Opus 对话 · AI 投资副驾驶{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-5">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <span>💬</span> Opus 对话
      </h1>
      <p class="text-sm text-gray-500 mt-1">研究 advisory · 非交易指令 · 可附带标的扫描上下文</p>
    </div>
    <div class="flex gap-3 text-sm shrink-0">
      <a href="/audit" class="text-blue-600 hover:underline">数据审计 →</a>
      <a href="/planning?view=radar" class="text-gray-500 hover:underline">行情雷达</a>
    </div>
  </div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col" style="min-height: calc(100vh - 220px);">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-3 pb-3 border-b border-gray-100">
    <p class="text-xs text-gray-500">默认模型与扫描勾选项可在<a href="/settings#radar-prefs" class="text-blue-600 hover:underline">设置</a>中调整</p>
    <button type="button" id="radar-chat-new-btn"
            class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50">
      新对话
    </button>
  </div>
  <div class="flex flex-wrap gap-3 items-end mb-4">
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">附带标的（可选）</label>
      <input type="text" name="symbol" id="radar-chat-symbol" maxlength="32"
             class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-40"
             placeholder="002837">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">模型</label>
      <select name="model_id" id="radar-chat-model"
              class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-44">
        {% for mid, label in chat_models|default([]) %}
        <option value="{{ mid }}" {% if mid == 'claude-opus-4-6' %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <p class="text-[11px] text-gray-400 pb-2">每轮回复下方显示 token 费用（元）</p>
  </div>
  <div id="radar-chat-messages"
       class="flex-1 overflow-y-auto rounded-xl bg-slate-50/90 border border-slate-100 mb-4 px-1"
       hx-get="/api/radar/chat/placeholder" hx-trigger="load" hx-swap="innerHTML"
       hx-headers='{"Accept": "text/html"}'>
    <div class="text-sm text-gray-400 text-center py-12">加载对话…</div>
  </div>
  <form id="radar-chat-form" class="flex gap-2 items-end"
        hx-post="/api/radar/chat"
        hx-target="#radar-chat-messages"
        hx-swap="innerHTML"
        hx-indicator="#radar-chat-spinner">
    <input type="hidden" name="session_id" id="radar-chat-session-id" value="">
    <input type="hidden" name="symbol" id="radar-chat-symbol-hidden" value="">
    <input type="hidden" name="model_id" id="radar-chat-model-hidden" value="">
    <div class="flex-1">
      <textarea name="message" id="radar-chat-input" rows="2" maxlength="4000" required
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm resize-none
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="输入问题… Shift+Enter 换行，Enter 发送"></textarea>
    </div>
    <button type="submit"
            class="shrink-0 px-5 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">
      发送
    </button>
  </form>
  <div id="radar-chat-spinner" class="htmx-indicator flex items-center gap-2 text-xs text-gray-400 mt-2">
    <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    Opus 思考中…
  </div>
</div>
<script>
  (function () {
    var KEY = 'radar_chat_sid';
    function sid() {
      var s = localStorage.getItem(KEY);
      if (!s) {
        s = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID().replace(/-/g, '').slice(0, 16)
          : String(Date.now());
        localStorage.setItem(KEY, s);
      }
      return s;
    }
    function syncSid() {
      var id = sid();
      var el = document.getElementById('radar-chat-session-id');
      if (el) el.value = id;
      var box = document.getElementById('radar-chat-messages');
      if (box) box.setAttribute('hx-get', '/api/radar/chat/' + id);
      return id;
    }
    syncSid();
    var symIn = document.getElementById('radar-chat-symbol');
    var symHid = document.getElementById('radar-chat-symbol-hidden');
    var modelSel = document.getElementById('radar-chat-model');
    var modelHid = document.getElementById('radar-chat-model-hidden');
    var form = document.getElementById('radar-chat-form');
    if (form && symIn && symHid) {
      form.addEventListener('submit', function () {
        symHid.value = (symIn.value || '').trim();
        if (modelSel && modelHid) modelHid.value = modelSel.value;
      });
    }
    var input = document.getElementById('radar-chat-input');
    if (input && form) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (input.value.trim() && typeof htmx !== 'undefined') {
            symHid.value = (symIn && symIn.value || '').trim();
            htmx.trigger(form, 'submit');
          }
        }
      });
    }
    document.body.addEventListener('htmx:afterSwap', function (ev) {
      if (ev.detail.target && ev.detail.target.id === 'radar-chat-messages') {
        var inner = document.getElementById('radar-chat-session-id');
        if (inner && inner.value) {
          localStorage.setItem(KEY, inner.value);
          var outer = document.querySelector('#radar-chat-form #radar-chat-session-id');
          if (outer) outer.value = inner.value;
        }
        var box = document.getElementById('radar-chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
        if (input) { input.value = ''; input.focus(); }
      }
    });
    var newBtn = document.getElementById('radar-chat-new-btn');
    if (newBtn) {
      newBtn.addEventListener('click', function () {
        var oldEl = document.getElementById('radar-chat-session-id');
        var oldId = oldEl ? oldEl.value : sid();
        if (typeof htmx !== 'undefined') {
          htmx.ajax('POST', '/api/radar/chat/new', {
            target: '#radar-chat-messages',
            swap: 'innerHTML',
            values: { session_id: oldId }
          }).then(function () {
            localStorage.removeItem(KEY);
            var newId = syncSid();
            var msgBox = document.getElementById('radar-chat-messages');
            if (msgBox) msgBox.setAttribute('hx-get', '/api/radar/chat/' + newId);
          });
        }
      });
    }
    if (typeof htmx !== 'undefined') {
      htmx.process(document.getElementById('radar-chat-messages'));
      htmx.trigger(document.getElementById('radar-chat-messages'), 'load');
    }
  })();
</script>
{% endblock %}

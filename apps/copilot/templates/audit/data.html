{% extends "base.html" %}
{% block title %}审计 · AI 投资副驾驶{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-5">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <span>📋</span> 审计
      </h1>
      <p class="text-sm text-gray-500 mt-1">T0 / T1 / T2 版本与 bundle 溯源 · 库内保留策略见<a href="/settings#radar-prefs" class="text-blue-600 hover:underline">设置</a></p>
    </div>
    <a href="/planning?view=radar" class="text-sm text-blue-600 hover:underline shrink-0">行情雷达 →</a>
  </div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
  <form class="flex flex-wrap gap-3 items-end mb-5" method="get" action="/audit">
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">标的代码或简称</label>
      <input type="text" name="symbol" value="{{ audit_symbol or '' }}" maxlength="32"
             class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-48 text-gray-900
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
             placeholder="002837">
    </div>
    <button type="submit"
            class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">
      查询版本
    </button>
  </form>
  <div id="radar-audit-panel" class="min-h-[12rem]">
    {{ audit_html|safe }}
  </div>
</div>
{% endblock %}

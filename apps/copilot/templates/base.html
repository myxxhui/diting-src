{# 基础布局，所有页面继承此模板。
   [Ref: 03_/00_维度零/stages/stage_1_启动期/steps/step_02] #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI 投资副驾驶{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      important: false,
    }
  </script>
  <style>
    /* 全局兼容基础层（供未迁移页继续使用 .card 等老 class） */
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0; padding: 0;
      background-color: #f3f4f6; /* gray-100 */
      color: #111827;
    }
    /* 顶部导航 */
    nav.site-nav {
      background: #111827;
      color: white;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 52px;
    }
    nav.site-nav .nav-brand {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e5e7eb;
      margin-right: 16px;
      letter-spacing: 0.02em;
    }
    nav.site-nav a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.88rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    nav.site-nav a:hover {
      background: #374151;
      color: #f9fafb;
      text-decoration: none;
    }
    nav.site-nav a.nav-active {
      background: #2563eb;
      color: white;
    }
    main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }
    /* 旧版 .card 兼容 */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    .card h2 { color: #111827; font-weight: 700; margin: 0 0 6px; }
    .card h3 { color: #1f2937; font-weight: 600; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #f3f4f6; }
    th { color: #6b7280; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; background: #f9fafb; }
    button { padding: 6px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; color: #374151; }
    button.primary { background: #2563eb; color: white; border-color: #2563eb; }
    input, select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="site-nav">
    <span class="nav-brand">AI 投资副驾驶</span>
    <a href="/">总览</a>
    <a href="/portfolio-guard">🛡️ 持仓监管</a>
    <a href="/planning">📡 行情解析及规划</a>
    <a href="/graph">🕸️ 产业图谱</a>
    <a href="/value">📒 价值账本</a>
    <a href="/system">⚙️ 系统</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

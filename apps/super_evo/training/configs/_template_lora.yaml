### LLaMA-Factory 训练模式（必须显式指定，新版 transformers 否则默认 eval）
stage: sft
do_train: true

### 模型配置（由 trainer.py 在运行时按 lora_name 覆盖）
model_name_or_path: models/Qwen2.5-7B-Instruct
template: qwen
trust_remote_code: true

### LoRA 配置
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### 数据配置
dataset: ${TASK}_train
eval_dataset: ${TASK}_val
dataset_dir: training/data/llama_factory
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 4

### 训练配置
output_dir: output/${LORA_NAME}
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.0
max_grad_norm: 1.0
fp16: true
gradient_checkpointing: true

### 评估 / 保存
do_eval: true
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
save_total_limit: 2
load_best_model_at_end: false

### 日志 / WandB
logging_steps: 10
report_to: none
# run_name: ${LORA_NAME}  # 需要 wandb 时取消注释

### sanity（被 trainer.py 通过 max_steps 覆盖时启用）
# max_steps: 50

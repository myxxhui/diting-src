[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diting-industry-graph"
version = "0.1.0"
description = "产业关系图谱系统"
requires-python = ">=3.11"

[project.optional-dependencies]
industry-graph = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "neo4j>=5.25",
    "arq>=0.5",
    "redis>=5.2",
    "pydantic>=2.9",
    "orjson>=3.10",
    "anthropic>=0.39",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "structlog>=24.0",
]

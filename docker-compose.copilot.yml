# Copilot：WeasyPrint 验证镜像 + Redis，供 step_04 / step_08 容器内测试与 §3.11 冒烟。
# 用法见 Makefile：make docker-copilot-build / docker-step08-pytest / docker-step08-smoke-up
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  copilot-test:
    build: .
    command:
      - python
      - -m
      - pytest
      - tests/copilot/test_monthly_pdf.py
      - tests/copilot/test_circuit_breaker.py
      - -v
      - --tb=short
    environment:
      COPILOT_ALERT_CONSUMER_ENABLED: "false"
      COPILOT_LEDGER_SCHEDULER_ENABLED: "false"

  copilot-app:
    build: .
    command: uvicorn apps.copilot.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      COPILOT_REDIS_URL: redis://redis:6379/0
      COPILOT_ADMIN_TOKEN: devtoken
      COPILOT_ALERT_CONSUMER_ENABLED: "false"
      COPILOT_LEDGER_SCHEDULER_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
